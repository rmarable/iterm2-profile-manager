# Lint and format settings only; nothing here is installed as a package. Run ./lint.sh.

[tool.ruff]
line-length = 100
target-version = "py39" # .tools/ run under /usr/bin/python3 3.9; AutoLaunch/ruff.toml raises it
extend-exclude = ["archive"]

[tool.ruff.per-file-target-version]
"srcp_score_presets.py" = "py312" # these run under iTerm2's Python, like AutoLaunch/
"srcp_ratings.py" = "py312"
".tests/*.py" = "py312" # run under iTerm2's Python: they exec the AutoLaunch script

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = [
    "PLR2004", # magic values: thresholds are named where they matter
    "S603",    # subprocess calls take fixed argument lists, never shell strings
    "S607",    # ps / defaults / pgrep by bare name, as on any Mac
]

[tool.ruff.lint.per-file-ignores]
# Writes SQL text to a file for restoring later, with every value escaped by sql_literal();
# nothing it builds is executed here.
".tools/srcp_export_curation.py" = ["S608"]

[tool.pyright]
# .tools/ is checked by lint.sh from a temp copy: pyright skips dot-folders.
include = ["AutoLaunch", "srcp_score_presets.py", "srcp_ratings.py"]
exclude = ["archive"]
typeCheckingMode = "standard"
executionEnvironments = [
    { root = "AutoLaunch", pythonVersion = "3.12" },
    { root = ".", pythonVersion = "3.12", extraPaths = [".tools"] }, # srcp_ratings imports srcp_favorites
]
