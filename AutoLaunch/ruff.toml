# The AutoLaunch script runs under iTerm2's Python 3.12, not /usr/bin/python3.
extend = "../pyproject.toml"
target-version = "py312"

[lint]
ignore = [
    "PLR2004",
    "S603",
    "S607",
    "S311", # random picks a color scheme, not a secret
    "B008", # iterm2.Reference("id") as a default is how the API passes the session id
]
